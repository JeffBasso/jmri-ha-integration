worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        # Ingress port — nginx rewrites absolute paths so assets load
        # through the HA ingress token URL. JMRI runs on 12080 directly.
        listen 12088;

        location /json/ {
            proxy_pass http://127.0.0.1:12080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host "127.0.0.1:12080";
            proxy_read_timeout 3600s;
        }

        location / {
            set $ingress_path $http_x_ingress_path;

            proxy_pass http://127.0.0.1:12080;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:12080";
            proxy_set_header Accept-Encoding "identity";

            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'href="/'   'href="$ingress_path/';
            sub_filter "href='/"   "href='$ingress_path/";
            sub_filter 'src="/'    'src="$ingress_path/';
            sub_filter "src='/"    "src='$ingress_path/";
            sub_filter 'action="/' 'action="$ingress_path/';
        }
    }
}
