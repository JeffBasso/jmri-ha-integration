worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 12080;

        # WebSocket endpoint for JMRI JSON API — no sub_filter, no encoding override
        location /json/ {
            proxy_pass http://127.0.0.1:12090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host "127.0.0.1:12090";
            proxy_read_timeout 3600s;
        }

        location / {
            set $ingress_path $http_x_ingress_path;

            proxy_pass http://127.0.0.1:12090;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:12090";
            proxy_set_header Accept-Encoding "identity";

            # Rewrite absolute paths in HTML so assets load through ingress.
            # X-Ingress-Path is e.g. /api/hassio_ingress/<token> (no trailing slash).
            # When accessing directly (no header), $ingress_path is empty and
            # the substitution is a no-op.
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter 'href="/'   'href="$ingress_path/';
            sub_filter "href='/"   "href='$ingress_path/";
            sub_filter 'src="/'    'src="$ingress_path/';
            sub_filter "src='/"    "src='$ingress_path/";
            sub_filter 'action="/' 'action="$ingress_path/';
        }
    }
}
